options:
  - virtualnet: "fnasjails:<random> default"
  - nat:
services:
  jellyfin:
    name: !ENV '${APP}-jellyfin'
    makejail: ./Makejail
    options:
      - template: ./template.conf
    volumes:
      - config: /var/db/jellyfin
      - cache: /var/cache/jellyfin
      - media: /media
    oci:
      environment:
        - PUID: !ENV '${PUID}'
        - PGID: !ENV '${PGID}'
        - TZ: !ENV '${TZ}'
volumes:
  config:
    device: ./config
  cache:
    device: ./cache
  media:
    device: !ENV '${MEDIA}'
    options: ro
