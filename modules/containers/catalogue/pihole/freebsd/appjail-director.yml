options:
  - virtualnet: "fnasjails:<random> default"
  - nat:
services:
  pihole:
    name: !ENV '${APP}-pihole'
    makejail: ./Makejail
    options:
      - expose: !ENV '${PORT}:80'
      - expose: !ENV '53:53 ext_ip:${DNS_ADDRESS}'
      - expose: !ENV '53:53 proto:udp ext_ip:${DNS_ADDRESS}'
    volumes:
      - etc: /usr/local/etc/pihole
      - dnsmasq: /usr/local/etc/dnsmasq.d
      - app: /mnt/app
volumes:
  etc:
    device: ./etc-pihole
  dnsmasq:
    device: ./dnsmasq.d
    options: ro
  app:
    device: .
    options: ro
