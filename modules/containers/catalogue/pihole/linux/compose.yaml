services:
  pihole:
    image: pihole/pihole:${PIHOLE_RELEASE}
    ports:
      - "${DNS_ADDRESS}:53:53/tcp"
      - "${DNS_ADDRESS}:53:53/udp"
      - "${PORT}:80/tcp"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./tls:/tls:ro
      - ./dnsmasq.d:/etc/dnsmasq.d:ro
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${WEB_PASSWORD}
      FTLCONF_dns_listeningMode: all
      FTLCONF_misc_etc_dnsmasq_d: 'true'
      FTLCONF_webserver_paths_webroot: /var/www/html
      FTLCONF_files_database: /etc/pihole/pihole-FTL.db
      FTLCONF_files_tmp_db: /etc/pihole/pihole-tmp.db
      FTLCONF_files_gravity: /etc/pihole/gravity.db
      FTLCONF_files_macvendor: /etc/pihole/macvendor.db
      HTTPS: ${HTTPS}
    entrypoint:
      - /bin/sh
      - -c
      - '[ "$$HTTPS" = true ] && export FTLCONF_webserver_port=80s FTLCONF_webserver_tls_cert=/tls/tls.pem FTLCONF_webserver_tls_validity=0 FTLCONF_webserver_domain=$$(cat /tls/hostname); exec start.sh'
    cap_add:
      - SYS_NICE
    restart: unless-stopped
